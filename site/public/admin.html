<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin · Felt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=11">
  <style>
    .adm-tabs { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
    .adm-tabs button { border: 2px solid var(--felt-line); background: var(--felt-deep); color: var(--cream-text); border-radius: 99px; padding: .4rem 1rem; font: 700 1rem var(--body); cursor: pointer; }
    .adm-tabs button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    .adm-game { margin: 1.5rem 0; }
    .adm-game h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .adm-item { background: var(--card); color: var(--ink); border-radius: 12px; padding: .8rem 1rem; margin-bottom: .6rem; box-shadow: 0 3px 0 var(--card-edge); }
    .adm-item .meta { font-size: .85rem; color: var(--ink-soft); margin-bottom: .4rem; }
    .adm-item input, .adm-item textarea { width: 100%; padding: .5rem .7rem; font: 700 1.05rem var(--body); border-radius: 8px; border: 2px solid var(--card-edge); background: #fffaf0; color: var(--ink); margin-bottom: .4rem; }
    .adm-item label { font-size: .8rem; font-weight: 700; color: var(--ink-soft); }
    .adm-item .btn-ghost { color: var(--ink); border-color: var(--ink-soft); }
    .adm-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f4d3a">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Felt">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</head>

    <a class="wordmark" href="index.html">Felt</a>

</body>
</html>
